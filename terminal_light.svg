<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" role="img" aria-label="FeelTech International — profile.sh --live">
<defs>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#00D4AA">
      <animate attributeName="stop-color" values="#00D4AA;#0891B2;#1E40AF;#00D4AA" dur="8s" repeatCount="indefinite"/>
    </stop>
    <stop offset="0.5" stop-color="#0891B2">
      <animate attributeName="stop-color" values="#0891B2;#1E40AF;#00D4AA;#0891B2" dur="8s" repeatCount="indefinite"/>
    </stop>
    <stop offset="1" stop-color="#1E40AF">
      <animate attributeName="stop-color" values="#1E40AF;#00D4AA;#0891B2;#1E40AF" dur="8s" repeatCount="indefinite"/>
    </stop>
  </linearGradient>
  <linearGradient id="logoGrad" x1="0" y1="0" x2="0" y2="320" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#0891B2"/>
    <stop offset="0.5" stop-color="#1E40AF"/>
    <stop offset="1" stop-color="#0A192F"/>
    <animateTransform attributeName="gradientTransform" type="translate" values="0 -80; 0 80; 0 -80" dur="6s" repeatCount="indefinite"/>
  </linearGradient>
  <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#FFFFFF"/>
    <stop offset="1" stop-color="#F1F5F9"/>
  </linearGradient>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="3" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="textGlow" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur stdDeviation="0.5" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <clipPath id="windowClip"><rect x="2" y="2" width="896" height="496" rx="12"/></clipPath>
</defs>
<rect width="900" height="500" rx="12" fill="url(#bgGrad)" stroke="url(#accent)" stroke-width="2"/>
<rect x="0" y="0" width="900" height="40" rx="12" fill="#E2E8F0" clip-path="url(#windowClip)"/>
<rect x="0" y="28" width="900" height="12" fill="#E2E8F0"/>
<circle cx="24" cy="20" r="7" fill="#FF5F56"/>
<circle cx="48" cy="20" r="7" fill="#FFBD2E"/>
<circle cx="72" cy="20" r="7" fill="#27CA40"/>
<text x="450" y="25" text-anchor="middle" font-size="13" fill="#475569">feeltech@africa ~ % ./profile.sh --live</text>
<rect x="20" y="44" width="860" height="2" fill="url(#accent)" rx="1" filter="url(#glow)">
  <animate attributeName="opacity" values="0.7;1;0.7" dur="3s" repeatCount="indefinite"/>
</rect>
<g transform="translate(40, 70)">
  <text font-size="10" fill="url(#logoGrad)" filter="url(#textGlow)" xml:space="preserve">
    <tspan x="0" dy="0">╔════════════════════════════════════════╗</tspan>
    <tspan x="0" dy="14">║                                        ║</tspan>
    <tspan x="0" dy="14">║  ████████ ████████ ████████ ██         ║</tspan>
    <tspan x="0" dy="14">║  ██       ██       ██       ██         ║</tspan>
    <tspan x="0" dy="14">║  ██████   ██████   ██████   ██         ║</tspan>
    <tspan x="0" dy="14">║  ██       ██       ██       ██         ║</tspan>
    <tspan x="0" dy="14">║  ██       ████████ ████████ ████████   ║</tspan>
    <tspan x="0" dy="14">║                                        ║</tspan>
    <tspan x="0" dy="14">║  ████████ ████████  ██████  ██     ██  ║</tspan>
    <tspan x="0" dy="14">║     ██    ██       ██       ██     ██  ║</tspan>
    <tspan x="0" dy="14">║     ██    ██████   ██       █████████  ║</tspan>
    <tspan x="0" dy="14">║     ██    ██       ██       ██     ██  ║</tspan>
    <tspan x="0" dy="14">║     ██    ████████  ██████  ██     ██  ║</tspan>
    <tspan x="0" dy="14">║                                        ║</tspan>
    <tspan x="0" dy="14">║         I N T E R N A T I O N A L      ║</tspan>
    <tspan x="0" dy="14">║                                        ║</tspan>
    <tspan x="0" dy="14">╚════════════════════════════════════════╝</tspan>
  </text>
</g>
<g transform="translate(480, 70)">
  <text font-size="14" font-weight="bold" fill="url(#accent)" filter="url(#textGlow)">
    <tspan x="0" dy="0">┌─────────────────────────────────────┐</tspan>
    <tspan x="0" dy="20">│  SYSTEM.INFO                        │</tspan>
    <tspan x="0" dy="20">└─────────────────────────────────────┘</tspan>
  </text>
  <g font-size="13">
    <text x="0" y="80" fill="#475569">$ <tspan fill="#0891B2">whoami</tspan></text>
    <text x="0" y="100" fill="#0A192F" filter="url(#textGlow)">→ FeelTech International</text>
    <text x="0" y="130" fill="#475569">$ <tspan fill="#0891B2">cat</tspan> mission.txt</text>
    <text x="0" y="150" fill="#0A192F" filter="url(#textGlow)">→ Solutions Technologiques Innovantes</text>
    <text x="0" y="180" fill="#475569">$ <tspan fill="#0891B2">echo</tspan> $LOCATION</text>
    <text x="0" y="200" fill="#0A192F" filter="url(#textGlow)">→ Douala, Cameroun</text>
    <text x="0" y="230" fill="#475569">$ <tspan fill="#0891B2">ls</tspan> ./stack/</text>
    <text x="0" y="250" fill="#0891B2" filter="url(#textGlow)">→ Flutter | .NET | Python | PostgreSQL</text>
    <text x="0" y="280" fill="#475569">$ <tspan fill="#0891B2">cat</tspan> expertise.json</text>
    <text x="0" y="300" fill="#1E40AF" filter="url(#textGlow)">→ EdTech | ERP | SaaS | FinTech</text>
    <text x="0" y="330" fill="#475569">$ <tspan fill="#0891B2">uptime</tspan></text>
    <text x="0" y="350" fill="#0A192F" filter="url(#textGlow)">→ Building Africa's Digital Future</text>
  </g>
</g>
<rect x="20" y="430" width="860" height="50" rx="8" fill="#E2E8F0" stroke="url(#accent)" stroke-width="1"/>
<g transform="translate(40, 460)">
  <text font-size="12" fill="#475569">
    <tspan fill="url(#accent)">●</tspan> STATUS: <tspan fill="#27CA40">ACTIVE</tspan>
    <tspan dx="30" fill="url(#accent)">●</tspan> PROJECTS: <tspan fill="#0891B2">17+</tspan>
    <tspan dx="30" fill="url(#accent)">●</tspan> COMMITS: <tspan fill="#0891B2">1.3k+</tspan>
    <tspan dx="30" fill="url(#accent)">●</tspan> CLIENTS: <tspan fill="#0891B2">Growing</tspan>
  </text>
</g>
<rect x="40" y="400" width="10" height="18" fill="#0891B2">
  <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
</rect>
<text x="55" y="415" font-size="13" fill="#475569">Ready for innovation_</text>
</svg>
