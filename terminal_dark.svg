<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" role="img" aria-label="FeelTech International — profile.sh --live">
<defs>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#00D4AA">
      <animate attributeName="stop-color" values="#00D4AA;#0891B2;#1E40AF;#00D4AA" dur="8s" repeatCount="indefinite"/>
    </stop>
    <stop offset="0.5" stop-color="#0891B2">
      <animate attributeName="stop-color" values="#0891B2;#1E40AF;#00D4AA;#0891B2" dur="8s" repeatCount="indefinite"/>
    </stop>
    <stop offset="1" stop-color="#1E40AF">
      <animate attributeName="stop-color" values="#1E40AF;#00D4AA;#0891B2;#1E40AF" dur="8s" repeatCount="indefinite"/>
    </stop>
  </linearGradient>
  <linearGradient id="logoGrad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#00D4AA"/>
    <stop offset="0.5" stop-color="#0891B2"/>
    <stop offset="1" stop-color="#1E40AF"/>
    <animateTransform attributeName="gradientTransform" type="translate" values="0 -0.5; 0 0.5; 0 -0.5" dur="6s" repeatCount="indefinite"/>
  </linearGradient>
  <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#0A192F"/>
    <stop offset="1" stop-color="#0D1B2A"/>
  </linearGradient>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="4" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="textGlow" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur stdDeviation="1" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <clipPath id="windowClip"><rect x="2" y="2" width="896" height="496" rx="12"/></clipPath>
</defs>
<rect width="900" height="500" rx="12" fill="url(#bgGrad)" stroke="url(#accent)" stroke-width="2"/>
<rect x="0" y="0" width="900" height="40" rx="12" fill="#1a1a2e" clip-path="url(#windowClip)"/>
<rect x="0" y="28" width="900" height="12" fill="#1a1a2e"/>
<circle cx="24" cy="20" r="7" fill="#FF5F56"/>
<circle cx="48" cy="20" r="7" fill="#FFBD2E"/>
<circle cx="72" cy="20" r="7" fill="#27CA40"/>
<text x="450" y="25" text-anchor="middle" font-size="13" fill="#64748B">feeltech@africa ~ % ./profile.sh --live</text>
<rect x="20" y="44" width="860" height="2" fill="url(#accent)" rx="1" filter="url(#glow)">
  <animate attributeName="opacity" values="0.5;1;0.5" dur="3s" repeatCount="indefinite"/>
</rect>
<g transform="translate(40, 70)">
  <text font-size="11" fill="url(#logoGrad)" filter="url(#textGlow)">
    <tspan x="0" dy="0">+-------------------------------------------+</tspan>
    <tspan x="0" dy="16">|                                           |</tspan>
    <tspan x="0" dy="16">|   FFFFF EEEEE EEEEE L                     |</tspan>
    <tspan x="0" dy="16">|   F     E     E     L                     |</tspan>
    <tspan x="0" dy="16">|   FFFF  EEEE  EEEE  L                     |</tspan>
    <tspan x="0" dy="16">|   F     E     E     L                     |</tspan>
    <tspan x="0" dy="16">|   F     EEEEE EEEEE LLLLL                 |</tspan>
    <tspan x="0" dy="16">|                                           |</tspan>
    <tspan x="0" dy="16">|   TTTTT EEEEE  CCCC H   H                 |</tspan>
    <tspan x="0" dy="16">|     T   E     C     H   H                 |</tspan>
    <tspan x="0" dy="16">|     T   EEEE  C     HHHHH                 |</tspan>
    <tspan x="0" dy="16">|     T   E     C     H   H                 |</tspan>
    <tspan x="0" dy="16">|     T   EEEEE  CCCC H   H                 |</tspan>
    <tspan x="0" dy="16">|                                           |</tspan>
    <tspan x="0" dy="16">|       INTERNATIONAL                       |</tspan>
    <tspan x="0" dy="16">|                                           |</tspan>
    <tspan x="0" dy="16">+-------------------------------------------+</tspan>
  </text>
</g>
<g transform="translate(480, 70)">
  <text font-size="14" font-weight="bold" fill="url(#accent)" filter="url(#textGlow)">
    <tspan x="0" dy="0">+-------------------------------------+</tspan>
    <tspan x="0" dy="20">|  SYSTEM.INFO                        |</tspan>
    <tspan x="0" dy="20">+-------------------------------------+</tspan>
  </text>
  <g font-size="13">
    <text x="0" y="80" fill="#64748B">$ <tspan fill="#00D4AA">whoami</tspan></text>
    <text x="0" y="100" fill="#F8FAFC" filter="url(#textGlow)">-&gt; FeelTech International</text>
    <text x="0" y="130" fill="#64748B">$ <tspan fill="#00D4AA">cat</tspan> mission.txt</text>
    <text x="0" y="150" fill="#F8FAFC" filter="url(#textGlow)">-&gt; Solutions Technologiques Innovantes</text>
    <text x="0" y="180" fill="#64748B">$ <tspan fill="#00D4AA">echo</tspan> $LOCATION</text>
    <text x="0" y="200" fill="#F8FAFC" filter="url(#textGlow)">-&gt; Douala, Cameroun</text>
    <text x="0" y="230" fill="#64748B">$ <tspan fill="#00D4AA">ls</tspan> ./stack/</text>
    <text x="0" y="250" fill="#0891B2" filter="url(#textGlow)">-&gt; Flutter | .NET | Python | PostgreSQL</text>
    <text x="0" y="280" fill="#64748B">$ <tspan fill="#00D4AA">cat</tspan> expertise.json</text>
    <text x="0" y="300" fill="#1E40AF" filter="url(#textGlow)">-&gt; EdTech | ERP | SaaS | FinTech</text>
    <text x="0" y="330" fill="#64748B">$ <tspan fill="#00D4AA">uptime</tspan></text>
    <text x="0" y="350" fill="#F8FAFC" filter="url(#textGlow)">-&gt; Building Africa's Digital Future</text>
  </g>
</g>
<rect x="20" y="430" width="860" height="50" rx="8" fill="#0D1B2A" stroke="url(#accent)" stroke-width="1"/>
<g transform="translate(40, 455)">
  <text font-size="12" fill="#64748B">
    <tspan fill="url(#accent)">*</tspan> STATUS: <tspan fill="#27CA40">ACTIVE</tspan>
    <tspan dx="30" fill="url(#accent)">*</tspan> PROJECTS: <tspan fill="#00D4AA">17+</tspan>
    <tspan dx="30" fill="url(#accent)">*</tspan> COMMITS: <tspan fill="#00D4AA">1.3k+</tspan>
    <tspan dx="30" fill="url(#accent)">*</tspan> CLIENTS: <tspan fill="#00D4AA">Growing</tspan>
  </text>
</g>
<rect x="40" y="400" width="10" height="18" fill="#00D4AA">
  <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
</rect>
<text x="55" y="415" font-size="13" fill="#64748B">Ready for innovation_</text>
</svg>
